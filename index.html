<style>
  html,body{margin:0;padding:0;height:100%;background:#1c3a22;overflow:hidden;touch-action:none;

<style id="mfsZoomStyle">
/* mfs-portrait-zoom v1 —— 勿手改;要改請改 skills/force-landscape-pwa/patches/add-portrait-zoom.mjs 後重打 */
#mfsFull{display:none}
@media (pointer:coarse){
  /* 只在觸控裝置、且還沒進全螢幕時出現;進了就自己藏 ⇒ 玩的時候不壓到棋盤/HUD。桌機不顯示(按 F11) */
  body:not(.mfs-fs) #mfsFull{position:fixed;display:flex;align-items:center;justify-content:center;
    top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));
    z-index:2147482000;width:42px;height:42px;padding:0;border-radius:11px;
    border:1px solid rgba(255,255,255,.42);background:rgba(9,15,19,.55);color:#fff;
    cursor:pointer;opacity:.55;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  body:not(.mfs-fs) #mfsFull:hover,body:not(.mfs-fs) #mfsFull:focus-visible{opacity:1}
}



</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script src="game.js"></script>
<script>
// play-stats 三層匿名計數(lobby-play-rank):開啟 10 分去重;-start/-done 不去重;-done 帶 t=秒。零個資。
(function(){
  var host = location.hostname;
  if (host === 'localhost' || host === '127.0.0.1' || location.protocol === 'file:') return;
  window.__ping = function(key, t){
    try{
      var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
      if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
    }catch(e){}
  };
  try{
    var k = 'ping-sheepfold-tsum', now = Date.now(), last = 0;
    try{ last = +localStorage.getItem(k) || 0; }catch(e){}
    if (now - last > 10*60*1000){ window.__ping('sheepfold-tsum'); try{ localStorage.setItem(k, ''+now); }catch(e){} }
  }catch(e){}
  // 真實停留:開頁→第一次離開(切走/鎖屏/關閉)回報一發,Worker 記平均+最近一次(-dwell)
  var _dwT0 = Date.now(), _dwSent = false;
  function _dwLeave(){
    if (_dwSent) return; _dwSent = true;
    var sec = Math.round((Date.now() - _dwT0) / 1000);
    if (sec >= 3 && sec <= 1800) window.__ping('sheepfold-tsum-dwell', sec);
  }
  addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') _dwLeave(); });
  addEventListener('pagehide', _dwLeave);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>


<div id="appVerBadge" style="position:fixed;right:6px;bottom:4px;font-size:11px;line-height:1;opacity:.55;z-index:2147483000;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-family:system-ui,sans-serif"></div>
    <script>
      /* 🏷️ appVerBadgeFade（0828）：版號徽章是 position:fixed 在右下角，實測會蓋住大廳卡片、
         遊戲的「難度 / 開始比賽」按鈕——pointer-events:none 只讓「點擊」穿過去，字還是被蓋著。
         做法：10 秒後淡出。要看版本就重新整理，平常不擋畫面。 */
      ;(function () {
        var b = document.getElementById('appVerBadge')
        if (!b) return
        b.style.transition = 'opacity .8s'
        setTimeout(function () {
          b.style.opacity = '0'
          setTimeout(function () { b.style.display = 'none' }, 900)
        }, 10000)
      })()
    </script>
<script>
/* 🏷️ 版號徽章(0820 全艦隊批次):問「正在控制本頁的 SW」拿版本=你手上真的在跑的那一版,
   頁面不寫死任何版號(不會漂)。硬重整(Ctrl+F5)的分頁不受 SW 管、問不到 → 誠實顯示退路
   (股票管家 v134 同款);SW 換版接管時會再問,自動換新。 */
(function () {
  var el = document.getElementById('appVerBadge');
  if (!el || !('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  var got = false;
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'SW_VERSION') {
      got = true;
      var s = String(e.data.v), m = /-((?:v|nf)?\d+)$/.exec(s);
      el.textContent = '🏷️ 版本 ' + (m ? m[1] : s) + '(這台裝置實際執行中的版本)';
    }
  });
  function ask() { var c = navigator.serviceWorker.controller; if (c) c.postMessage('GET_VERSION'); }
  navigator.serviceWorker.ready.then(ask).catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', ask);
  setTimeout(function () {
    if (got) return;
    if (!navigator.serviceWorker.controller) el.textContent = '🏷️ 版本 —(強制重新整理的分頁問不到;普通重整一次即顯示)';
    else { ask(); setTimeout(function () { if (!got) el.textContent = '🏷️ 版本 —(讀不到,重整一次即顯示)'; }, 1500); }
  }, 1600);
})();
</script>
<!-- mfs-portrait-zoom v1 -->
<button type="button" id="mfsFull" title="放大(全螢幕)" aria-label="放大(全螢幕)" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<script>
/* mfs-portrait-zoom v1 */
(function () {
  try {
    if (window.self !== window.top) { var f0 = document.getElementById('mfsFull'); if (f0) f0.remove(); return; } /* 嵌入時不搶宿主 */
    var targetSel = "";
    var fsEl = function () { return (targetSel && document.querySelector(targetSel)) || document.documentElement; };
    var isFs = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
    var immersive = false;
    var btn = document.getElementById('mfsFull');
    
    function refit() {
      /* Three.js / canvas 遊戲多半聽 resize 重算;版面剛變、要等一幀再發,不然量到舊尺寸 */
      requestAnimationFrame(function () { try { window.dispatchEvent(new Event('resize')); } catch (e) {} });
    }
    function paint() {
      try {
        document.body.classList.toggle('immersive', immersive);
        document.body.classList.toggle('mfs-fs', isFs());
        if (btn) { btn.setAttribute('aria-pressed', String(immersive)); var s = btn.querySelector('span'); if (s) s.textContent = immersive ? '縮小' : '放大'; }
      } catch (e) {}
      refit();
    }
    function toggle() {
      immersive = !immersive;
      try {
        var el = fsEl();
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
        var out = document.exitFullscreen || document.webkitExitFullscreen;
        if (immersive && req && !isFs()) { var p = req.call(el); if (p && p.catch) p.catch(function () {}); }
        else if (!immersive && isFs() && out) { var q = out.call(document); if (q && q.catch) q.catch(function () {}); }
      } catch (e) { /* iOS Safari 不支援網頁全螢幕:只吃 immersive 樣式,不能炸遊戲 */ }
      paint();
    }
    if (btn) btn.addEventListener('click', toggle);
    /* 使用者按 Esc / 系統手勢退出全螢幕 ⇒ 沉浸樣式也收;只在支援全螢幕的裝置跟隨(iPhone 沒這事件,跟隨會誤關) */
    var supports = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    if (supports) ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
      document.addEventListener(ev, function () { if (!isFs() && immersive) { immersive = false; } paint(); });
    });
    paint();
  } catch (e) {}
})();
</script>
</body>
